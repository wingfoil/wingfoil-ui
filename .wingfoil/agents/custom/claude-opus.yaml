# Claude Code on claude-opus-5-5, one adapter per model: the model goes in the launch
# arguments, since an adapter has no model field; the run record's `model` checks it. Its tier is
# the line's mapping in config/runner.yaml. Built from the built-in claude-code adapter; the
# headless profile is the runner's (directive wingfoil-cli, The script runner; WingFoil reads it from 1.0 only), which adds
# --add-dir and --allowedTools (config/runner.yaml adapter_extra_args). Flags checked against
# `claude --help` of 2.1.322. The model id is the approver's choice.
name: claude-opus
format: 1
command: claude
verified_with: "2.1.322 (Claude Code)"
version_args: [ --version ]
launch:
  interactive:
    # The prompt first: --mcp-config takes several values and would read a following prompt as one.
    args: [ "{bootstrap}", --model, claude-opus-5-5, --mcp-config, "{mcp_config_file}" ]
    terminal: required
  headless:
    args: [ -p, "{bootstrap}", --model, claude-opus-5-5, --output-format, json, --permission-mode, acceptEdits, --mcp-config, "{mcp_config_file}" ]
    output: json
prompt:
  via: arg
mcp:
  via: config-file
  template: |
    {"mcpServers": {"wingfoil": {"command": "{mcp_command}", "args": {mcp_args}}}}
session:
  id: assign
  assign_args: [ --session-id, "{session_id}" ]
  resume:
    supported: true
    args: [ --resume, "{session_id}" ]
usage:
  from: output
  fields:
    input: usage.input_tokens
    output: usage.output_tokens
    cache_read: usage.cache_read_input_tokens
    cache_write: usage.cache_creation_input_tokens

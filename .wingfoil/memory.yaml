# WingFoil UI — Memory element schema
# Declares each Memory element type: path pattern, id pattern, template and its own state machine.
# There is no global state machine: CLI verbs (submit/approve/reject/park/amend/deprecate) are
# validated against each type's graph.
#
# Composed from the wingfoil-templates packs base@2.0.1, software@1.0.0 and methodology/scrum@1.0.0
# with this repository's path and id values, so that no file moved
# (governance-alignment-rel-v0.3-plan step 3; the adoption design in
# docs/wingfoil-adoption/rel-v0.3-packs-adoption-design.md). The states,
# gates, `returns` and `amendable` keys are the packs'; this repository's own entries are re-added
# on top of them:
#   - per type: `name`, `description`, `tags`, the template file (memory/templates/<type>.md, this
#     repository's own templates; the packs' are under memory/templates/built-in/), and the
#     required fields the packs leave to the project (release: kind, pillar, features,
#     requirements; task: release; adr: sard_ref; tech-spec: scope; bug: severity);
#   - `lists: [ features ]` on release (task-046 a1: WingFoil 0.3.x counts a list as missing
#     unless the type lists it);
#   - `exempt` on release: the releases added before the Sprints (methodology/scrum README step 4);
#   - the `service` type.
# Removed with the adoption: the `waiting` states of release, task, bug and release-line (the
# packs keep `waiting` only where WingFoil drives the edge for every project), so those edges move
# by `memory submit` or `memory approve`; directive `wingfoil-cli` is re-checked in 1.15 (step 4).
# Deviations from the packs (GA3-11, the approver, 2026-11-01): R-1 a gate on release `releasing`
# (approve → released, after the publication); R-2 a gate on release-line `active` (approve →
# done); R-3 no gate on bug `planned` (submit → in-progress when the fix starts).
#
# Template ↔ workflow rule: `template.frontmatter.required` lists the fields to fill after
# `memory add`; `memory add --set` fills only id/path tokens: every other field is filled by
# editing the draft before `memory submit` (directive wingfoil-cli W-01).
format: 1
version: 1

# Default machine for a type without its own `states` block.
defaults:
  states:
    sequence: [ draft, pending, approved ]
    gates:
      pending: { reject: draft }

types:
  release-line:
    path: "docs/04_memory/planning/{id}.md"
    id_pattern: "rl-{version}"                  # e.g. rl-v1
    name: Release Line
    description: A major version line (v1, v2, ...) grouping the minor releases that deliver it. Managed outside `delivery` — added and submitted by the product-owner, approved by the approver (`planning → active`), its roadmap by the `initial-design` procedure, closed by the approver's `memory approve` (`active → done`) once every release under it is `released`.
    tags: [ release-line, roadmap ]
    amendable: false
    template:
      file: "memory/templates/release-line.md"
      frontmatter:
        required: [ title, version ]
    states:
      sequence: [ draft, planning, active, done ]
      gates:
        planning: { reject: draft }   # approve: planning->active
        active:   { reject: planning }  # approve: active->done, the approver closes the line (GA3-11 R-2, deviation from software)

  release:
    path: "docs/04_memory/planning/{release-line}/{id}.md"   # release-line holds the version: planning/v1/
    id_pattern: "{kind}-{version}"              # e.g. minor-v0.1, patch-v0.2.1
    name: Release
    description: A release of WingFoil UI, centered on one feature area (`pillar`), belonging to a release-line — a `minor`, or a `patch` of a released minor — and to the Sprint whose `release` phase carries it (`sprint`). Workflow — added by the `initial-design` procedure (roadmap) or the Sprint's `plan-release`; run by the `release` slot (`release-submit`, `release-publishing`) inside its Sprint.
    tags: [ release, roadmap ]
    amendable: true
    template:
      file: "memory/templates/release.md"
      frontmatter:
        required: [ title, version, release-line, sprint, kind, pillar, features, requirements ]
        lists: [ features ]
        exempt:
          sprint: [ minor-v0.1, minor-v0.2 ]   # released before the Sprints (methodology/scrum README step 4)
    states:
      sequence: [ draft, planning, in-development, releasing, released ]
      gates:
        releasing: { reject: in-development }   # approve: releasing->released, the approver after the publication (GA3-11 R-1, deviation from software)

  task:
    path: "docs/04_memory/{release}/{id}.md"
    id_pattern: "task-{n}-{slug}"
    name: Task
    description: A unit of development work delivered inside a release, on one module (server, web, contracts) — the Product Backlog item of Scrum. Workflow — created at the Sprint's planning (this repository's `release-planning` procedure); iterated by the Sprint's `development` (`backlog-item`). A fix task lists the bugs it closes in `bug:`; `sprint` names its Sprint, or `n/a — <reason>` until a Sprint selects it.
    tags: [ task, backlog ]
    amendable: true
    template:
      file: "memory/templates/task.md"
      frontmatter:
        required: [ title, sprint, release ]
        not_applicable_allowed: [ sprint ]
    states:
      sequence: [ draft, pending, backlog, in-progress, in-review, approved, done ]
      gates:
        pending:   { reject: draft }        # approve: pending->backlog
        in-review: { reject: in-progress }  # approve: in-review->approved
      returns:
        in-progress: backlog                # memory park

  adr:
    path: "docs/04_memory/design/adrs/{id}.md"
    id_pattern: "adr-{n}-{slug}"
    name: Architectural Decision Record
    description: An architectural decision with context, decision, and consequences. Workflow — `adr-ingest`, and the `release-planning` procedure (`record-adrs`).
    tags: [ adr, architecture, design ]
    amendable: true
    template:
      file: "memory/templates/adr.md"
      frontmatter:
        required: [ title, sard_ref ]
    states:
      sequence: [ draft, pending, accepted, superseded ]
      gates:
        pending: { reject: draft }      # approve: pending->accepted
      waiting: [ accepted ]             # accepted->superseded by a later ADR's `supersedes:`

  decision-log:
    path: "docs/04_memory/design/dls/{id}.md"
    id_pattern: "dl-{n}-{slug}"
    name: Decision Log
    description: A product/process decision record. Workflow — `decision-log-ingest` (a decision that changes no governance), `governance-evolution` (`propose`), the `retrospective` (`capture`, tagged `retrospective`) and `end-of-life` (`announce`, tagged `end-of-life`).
    tags: [ decision-log, decision, product ]
    amendable: true
    template:
      file: "memory/templates/decision-log.md"
      frontmatter:
        required: [ title ]
    states:
      sequence: [ draft, in-discussion, ready ]
      gates:
        in-discussion: { reject: draft }   # approve: in-discussion->ready (terminal)

  tech-spec:
    path: "docs/04_memory/design/specs/{id}.md"
    id_pattern: "spec-{n}-{slug}"
    name: Technical Specification
    description: A definition of a shared format, schema, contract or module API implemented by one or more tasks — e.g. the server HTTP API, a consumed CLI JSON contract, the `.wingfoil/ui.yaml` schema. Workflow — the `specification` slot (`specify`), the `initial-design` and `release-planning` procedures (`seed-specs`, `identify-specs`); the `dev-loop` procedure's `design` is a reactive fallback.
    tags: [ tech-spec, design, architecture ]
    amendable: true
    template:
      file: "memory/templates/tech-spec.md"
      frontmatter:
        required: [ title, scope ]
    states:
      sequence: [ draft, pending, approved, superseded ]
      gates:
        pending: { reject: draft }      # approve: pending->approved
      waiting: [ approved ]             # approved->superseded by a later spec's `supersedes:`

  bug:
    path: "docs/04_memory/bugs/{id}.md"
    id_pattern: "bug-{n}-{slug}"
    name: Bug
    description: A defect report. Workflow — `bug-ingest` (capture, then the approver's triage); a triaged bug is planned into a release by a fix task (`bug:` of the task); `triaged → planned` is the approver's `memory approve`; `planned → in-progress` is `memory submit` when its fix starts.
    tags: [ bug, defect ]
    amendable: true
    template:
      file: "memory/templates/bug.md"
      frontmatter:
        required: [ title, severity ]
    states:
      sequence: [ draft, open, triaged, planned, in-progress, in-review, resolved, closed ]
      gates:
        open:      { reject: closed }        # approve: open->triaged · reject: wontfix/duplicate
        triaged:   { reject: closed }        # approve: triaged->planned · reject: wontfix after triage
        # no gate on `planned`: any team identity can move it planned->in-progress with `memory submit` — by rule the developer, when the fix starts at backlog-item `start`; no wontfix (reject to closed) from `planned` any more (GA3-11 R-3, deviation from software)
        in-review: { reject: in-progress }   # approve: in-review->resolved
        resolved:  { reject: in-progress }   # approve: resolved->closed
      returns:
        in-progress: planned                 # memory park

  plan:
    path: "docs/05_plans/{scope}/{id}.md"       # scope: sw-life-cycle (before the first release-line), rl-vN, rl-vN/rel-vX.Y
    id_pattern: "{workflow}-{phase}-plan"       # e.g. dev-loop-rel-v0.1-plan, governance-alignment-rel-v0.3-plan
    name: Phase plan
    description: "The executable plan of one workflow run or phase. A plan started by `workflow start` is closed by `workflow end`; a phase plan carries `parent` (`<workflow>.<phase>`) and is closed by a hand-written `wf(plan): finalize <id> [active → done]` commit (directive wingfoil-cli W-04) — `memory submit` no longer closes a plan."
    tags: [ plan, process, workflow ]
    amendable: true
    template:
      file: "memory/templates/plan.md"
      frontmatter:
        required: [ title, workflow, phase ]
    states:
      sequence: [ draft, active, done ]
      waiting: [ active ]

  sprint:
    path: "docs/04_memory/sprints/{id}.md"
    id_pattern: "sprint-{n}"
    name: Sprint
    description: One fixed-length Sprint (methodology/scrum) — its timebox, its Sprint Goal (`goal`) and, in its body, the Sprint Review's outcome. Workflow — the first added by `delivery`'s `plan-sprint`, the next ones by `memory add` outside a step; run by `sprint`. One is `active` at a time.
    tags: [ sprint, scrum ]
    amendable: true
    template:
      file: "memory/templates/built-in/sprint.md"
      frontmatter:
        required: [ title, goal ]
    states:
      sequence: [ draft, planned, active, done ]
      limits:
        active: 1

  service:
    path: "docs/04_memory/services/{id}.md"
    id_pattern: "svc-{n}-{slug}"                # e.g. svc-001-github-repository
    name: External Service
    description: One unit of state outside the git repository that the project owns, depends on, or presents itself through (account, credential by reference, registry listing, platform setting, domain). Never holds a secret value. Workflow — created via the `service-ingest` main, and by any phase that sets up external state (e.g. release-publishing).
    tags: [ service, external, operations ]
    template:
      file: "memory/templates/service.md"
      frontmatter:
        required: [ title, provider, kind, owner_role, verify ]
    states:
      sequence: [ draft, pending, active ]
      gates:
        pending: { reject: draft }   # approve: pending->active (the approver ran `verify`)

# WingFoil UI — Memory element schema
# Declares each Memory element type: path pattern, id pattern, template and its own state machine.
# There is no global state machine: CLI verbs (submit/approve/reject/deprecate) are validated
# against each type's graph.
#
# Derived from the WingFoil repository's .wingfoil/memory.yaml (wingfoil/wingfoil@v0.2.2): same
# types, paths, id patterns, required fields and state machines, so both projects read alike.
# The base is the WingFoil release this project pins (governance-alignment-rel-v0.2-plan GA-3).
# Until 2026-10-12 the header named wingfoil/wingfoil@c43221c4, a later `main` commit whose
# `.wingfoil/` differs from v0.2.2 only in WingFoil's own memory.yaml (comments, version key, the
# per-type `amendable` keys) and in its command-baseline directive; none of it is adopted here.
# `amendable` (WingFoil dl-108, `memory amend`) is unknown to the pinned wingfoil@0.2.2 — add it
# when the pin advances to a version that ships `memory amend`.
#
# Template ↔ workflow rule: `template.frontmatter.required` lists the fields to fill after
# `memory add`; workflow steps producing a type declare the same list as a post check. If they
# diverge, the template is authoritative. With 0.2.2, `memory add --set` fills only id/path tokens:
# every other field is filled by editing the draft before `memory submit` (directive wingfoil-cli).
#
# Types are declared on a need basis (a workflow or a role produces/consumes them):
#   release-line — one per major version (v1, …); the first seeded by sw-life-cycle
#                  (seed-first-release-line), the next ones by release-line-cycle.
#   release      — a minor wave (v0.1, …) or a patch of a released minor (`kind: patch`);
#                  seeded by initial-design, iterated by release-cycle.
#   task         — produced by release-planning; iterated by dev-loop.
#   adr          — initial-design, release-planning, or on demand via adr-ingest.
#   decision-log — retrospective, end-of-life, or on demand via decision-log-ingest.
#   bug          — on demand via bug-ingest; fixed through release-planning tasks.
#   tech-spec    — initial-design (seed-specs), release-planning (identify-specs), dev-loop/design.
#   plan         — one per started workflow phase; the interim substitute for the workflow engine.
#   service      — external state the project owns or depends on (npm package, GitHub repo, …).
version: 1

# Default machine for a type without its own `states` block.
defaults:
  states:
    sequence: [ draft, pending, approved ]
    gates:
      pending: { reject: draft }

types:
  release-line:
    path: "docs/04_memory/planning/{id}.md"
    id_pattern: "rl-{version}"                  # e.g. rl-v1
    name: Release Line
    description: A major version line (v1, v2, ...) grouping the minor release waves that deliver it. Workflow — the first one is seeded by sw-life-cycle's `seed-first-release-line`; each following one by its own release-line-cycle (`plan-next-release-line`); iterated by sw-life-cycle.
    tags: [ release-line, roadmap ]
    template:
      frontmatter:
        required: [ title, version ]
      file: "memory/templates/release-line.md"
    states:
      sequence: [ draft, planning, active, done ]
      gates:
        planning: { reject: draft }   # approve: planning->active
      waiting: [ active ]             # active->done when every release under it is `released`

  release:
    path: "docs/04_memory/planning/{release-line}/{id}.md"   # release-line holds the version: planning/v1/
    id_pattern: "{kind}-{version}"              # e.g. minor-v0.1, patch-v0.2.1
    name: Release
    description: A release wave of WingFoil UI, centered on one feature area (`pillar`), belonging to a release-line — a `minor`, or a `patch` of a released minor. Workflow — a minor is seeded by release-line-cycle's `initial-design` (`seed-releases`); iterated by release-cycle.
    tags: [ release, roadmap ]
    template:
      frontmatter:
        required: [ title, kind, version, pillar, features, requirements, release-line ]
      file: "memory/templates/release.md"
    states:
      sequence: [ draft, planning, in-development, releasing, released ]
      waiting: [ planning, in-development, releasing ]   # draft->planning: memory.submit; the rest: workflow phases

  task:
    path: "docs/04_memory/{release}/{id}.md"
    id_pattern: "task-{n}-{slug}"
    name: Task
    description: A unit of development work delivered inside a release, on one module (server, web, contracts). Workflow — generated by release-planning; iterated by dev-loop. A fix task lists the bugs it closes in `bug:`.
    tags: [ task, backlog ]
    template:
      frontmatter:
        required: [ title, release ]
      file: "memory/templates/task.md"
    states:
      sequence: [ draft, pending, backlog, in-progress, in-review, approved, done ]
      gates:
        pending:   { reject: draft }        # approve: pending->backlog
        in-review: { reject: in-progress }  # approve: in-review->approved
      waiting: [ backlog, approved ]        # backlog->in-progress (dev-loop starts); approved->done (dev-loop finalizes)

  adr:
    path: "docs/04_memory/design/adrs/{id}.md"
    id_pattern: "adr-{n}-{slug}"
    name: Architectural Decision Record
    description: An architectural decision with context, decision, and consequences. Workflow — created by initial-design & release-planning, and on demand via the `adr-ingest` main.
    tags: [ adr, architecture, design ]
    template:
      frontmatter:
        required: [ title, sard_ref ]
      file: "memory/templates/adr.md"
    states:
      sequence: [ draft, pending, accepted, superseded ]
      gates:
        pending: { reject: draft }      # approve: pending->accepted
      waiting: [ accepted ]             # accepted->superseded by a later ADR's `supersedes:`

  decision-log:
    path: "docs/04_memory/design/dls/{id}.md"
    id_pattern: "dl-{n}-{slug}"
    name: Decision Log
    description: A product/process decision record. Workflow — produced by retrospective / end-of-life, and on demand via the `decision-log-ingest` main.
    tags: [ decision-log, decision, product ]
    template:
      frontmatter:
        required: [ title ]
      file: "memory/templates/decision-log.md"
    states:
      sequence: [ draft, in-discussion, ready ]
      gates:
        in-discussion: { reject: draft }  # approve: in-discussion->ready (terminal)
      waiting: [ ]

  tech-spec:
    path: "docs/04_memory/design/specs/{id}.md"
    id_pattern: "spec-{n}-{slug}"
    name: Technical Specification
    description: A definition of a shared format, schema, contract or module API implemented by one or more tasks — e.g. the server HTTP API, a consumed CLI JSON contract, the `.wingfoil/ui.yaml` schema. Workflow — produced by initial-design (`seed-specs`) and release-planning (`identify-specs`); dev-loop/design is a reactive fallback.
    tags: [ tech-spec, design, architecture ]
    template:
      frontmatter:
        required: [ title, scope ]
      file: "memory/templates/tech-spec.md"
    states:
      sequence: [ draft, pending, approved, superseded ]
      gates:
        pending: { reject: draft }      # approve: pending->approved
      waiting: [ approved ]             # approved->superseded by a later spec's `supersedes:`

  bug:
    path: "docs/04_memory/bugs/{id}.md"
    id_pattern: "bug-{n}-{slug}"
    name: Bug
    description: A defect report. Workflow — created via the `bug-ingest` main; triaged there, then release-planning creates its fix task(s); its state follows them (dev-loop `bug.sync_state`).
    tags: [ bug, defect ]
    template:
      frontmatter:
        required: [ title, severity ]
      file: "memory/templates/bug.md"
    states:
      sequence: [ draft, open, triaged, planned, in-progress, in-review, resolved, closed ]
      gates:
        open:      { reject: closed }        # approve: open->triaged · reject: wontfix/duplicate
        triaged:   { reject: closed }        # wontfix after triage
        planned:   { reject: closed }        # wontfix before the fix starts
        in-review: { reject: in-progress }   # approve: in-review->resolved
        resolved:  { reject: in-progress }   # approve: resolved->closed
      waiting: [ triaged, planned ]          # triaged->planned (release-planning); planned->in-progress (dev-loop)

  plan:
    path: "docs/05_plans/{scope}/{id}.md"       # scope: sw-life-cycle (before the first release-line), rl-vN, rl-vN/rel-vX.Y
    id_pattern: "{workflow}-{phase}-plan"       # e.g. lean-inception-inception-plan, dev-loop-rel-v0.1-plan
    name: Phase plan
    description: The executable plan for one workflow phase — the interim substitute for the not-yet-built workflow engine. Whenever a workflow phase starts, its plan is authored under docs/05_plans/ and executed against. Workflow — produced by the phase that runs it.
    tags: [ plan, process, workflow ]
    template:
      frontmatter:
        required: [ title, workflow, phase ]
      file: "memory/templates/plan.md"
    states:
      sequence: [ draft, active, done ]
      waiting: [ active ]        # active->done: no verb in 0.2.2 — finalized by hand (directive wingfoil-cli)

  service:
    path: "docs/04_memory/services/{id}.md"
    id_pattern: "svc-{n}-{slug}"                # e.g. svc-001-github-repository
    name: External Service
    description: One unit of state outside the git repository that the project owns, depends on, or presents itself through (account, credential by reference, registry listing, platform setting, domain). Never holds a secret value. Workflow — created via the `service-ingest` main, and by any phase that sets up external state (e.g. release-publishing).
    tags: [ service, external, operations ]
    template:
      frontmatter:
        required: [ title, provider, kind, owner_role, verify ]
      file: "memory/templates/service.md"
    states:
      sequence: [ draft, pending, active ]
      gates:
        pending: { reject: draft }   # approve: pending->active (the approver ran `verify`)
      waiting: [ ]

# WingFoil UI — DNA. Composed from the wingfoil-templates packs base@2.0.1, software@1.0.0 and
# methodology/scrum@1.0.0 (team roles with their descriptions, the approver member, the agent and
# its executes_as, paths.config), with this repository's own entries re-added: the project's
# description, license, repository and methodology, its modules, stacks and paths, the member's
# roles, and `tech-lead` in the agent's executes_as (governance-alignment-rel-v0.3-plan GA3-7).
format: 1
version: 1
project:
  name: WingFoil UI
  description: Local web UI for WingFoil-governed projects, served by a local server that drives the wingfoil CLI.
  license: MIT
  repository: wingfoil-ui
  methodology: scrum
modules:
  - name: server
    description: Local HTTP server and WingFoil CLI adapter (placeholder until initial-design)
    path: server/
  - name: web
    description: Browser UI (placeholder until initial-design)
    path: web/
  - name: contracts
    description: JSON schemas of the consumed WingFoil CLI output (placeholder until initial-design)
    path: contracts/
stacks:
  technologies:
    - name: TypeScript
      category: language
    - name: Node.js
      category: runtime
      version: 22.12+
    - name: npm
      category: package manager
    - name: WingFoil CLI
      category: governance
      version: 0.3.1
      notes: pinned devDependency; also the CLI contract the UI consumes (support matrix 0.2.2, 0.3.1)
    - name: git
      category: version control
    - name: Playwright
      category: e2e testing
      notes: 'confirmed by adr-002: e2e on Chromium, Firefox, WebKit'
    - name: axe-core
      category: accessibility testing
      notes: 'confirmed by adr-002: @axe-core/playwright, both themes'
    - name: Fastify
      category: server framework
      notes: 'adr-002: HTTP API and SSE, JSON Schema validation (Ajv), pino'
    - name: React
      category: frontend framework
      notes: adr-002
    - name: Vite
      category: bundler
      notes: 'adr-002: dev server and static SPA build'
    - name: React Aria Components
      category: accessibility
      notes: 'adr-002: accessible primitives (WCAG 2.1 AA)'
    - name: TanStack Query
      category: frontend state
      notes: 'adr-002: server state, invalidated by the event stream'
    - name: TanStack Router
      category: frontend routing
      notes: adr-002
    - name: FormatJS
      category: i18n
      notes: 'adr-002: react-intl message catalogues'
    - name: Vitest
      category: unit testing
      notes: 'adr-002: unit, component and contract tests'
  methodologies:
    - name: Lean Inception
      phase: inception
    - name: User Story Mapping
      phase: specification
    - name: Specification by Example (BDD)
      phase: specification
    - name: SARD
      phase: specification
    - name: Scrum
      phase: delivery
      notes: methodology/scrum@1.0.0 — Sprints of 2 weeks
    - name: TDD
      phase: delivery
team:
  roles:
    - name: approver
      description: Rules decisions and approves gates; a person, never an agent.
    - name: facilitator
      description: "Runs the workflows: captures, assesses, proposes and applies."
    - name: product-owner
      description: Owns what the project captures and decides to do.
    - name: architect
      description: "Shapes the system: writes the tech-specs and the architecture decisions."
    - name: developer
      description: Writes the code and its tests, and captures the bugs found.
    - name: reviewer
      description: Reviews the work of others before it is accepted.
    - name: qa
      description: Checks a release before it is published and rehearses its publication.
    - name: tech-lead
      description: "Triages bugs and runs a release: its states, commit, tag and publication."
  members:
    - name: Roberto Pompermaier
      email: robypomper@gmail.com
      roles:
        - approver
        - tech-lead
        - architect
        - developer
        - reviewer
        - product-owner
        - facilitator
        - qa
  agents:
    - name: AI agent (Claude/Cursor/etc.)
      executes_as:
        - facilitator
        - product-owner
        - developer
        - reviewer
        - qa
        - architect
        - tech-lead
      approval_authority: false
paths:
  sources:
    - server/
    - web/
    - contracts/
  tests:
    - test/
  docs:
    - docs/
  config:
    - package.json
    - .wingfoil
  governance:
    - .wingfoil/

version: 1
project:
  name: WingFoil UI
  description: Local web UI for WingFoil-governed projects, served by a local server that drives the wingfoil CLI.
  license: MIT
  repository: wingfoil-ui
  methodology: custom
modules:
  - name: server
    description: Local HTTP server and WingFoil CLI adapter (placeholder until initial-design)
    path: server/
  - name: web
    description: Browser UI (placeholder until initial-design)
    path: web/
  - name: contracts
    description: JSON schemas of the consumed WingFoil CLI output (placeholder until initial-design)
    path: contracts/
stacks:
  technologies:
    - name: TypeScript
      category: language
    - name: Node.js
      category: runtime
      version: 22.12+
    - name: npm
      category: package manager
    - name: WingFoil CLI
      category: governance
      version: 0.2.2
      notes: pinned devDependency; also the CLI contract the UI consumes
    - name: git
      category: version control
    - name: Playwright
      category: e2e testing
      notes: to be confirmed by initial-design
    - name: axe-core
      category: accessibility testing
      notes: to be confirmed by initial-design
  methodologies:
    - name: Lean Inception
      phase: inception
    - name: User Story Mapping
      phase: specification
    - name: Specification by Example (BDD)
      phase: specification
    - name: SARD
      phase: specification
    - name: TDD
      phase: delivery
team:
  members:
    - name: Roberto Pompermaier
      email: robypomper@gmail.com
      roles:
        - tech-lead
        - architect
        - developer
        - reviewer
        - product-owner
        - approver
        - facilitator
        - qa
  roles:
    - name: developer
    - name: reviewer
    - name: qa
    - name: architect
    - name: product-owner
    - name: tech-lead
    - name: approver
    - name: facilitator
      description: Drives discovery/inception sessions (Lean Inception).
  agents:
    - name: AI agent (Claude/Cursor/etc.)
      executes_as:
        - developer
        - reviewer
        - qa
        - architect
      approval_authority: false
paths:
  sources:
    - server/
    - web/
    - contracts/
  tests:
    - test/
  docs:
    - docs/
  config:
    - package.json
  governance: []

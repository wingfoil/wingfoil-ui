format: 1
# One Sprint Backlog item. Not named dev-loop: a project's own dev-loop keeps its name.
# Deviations from methodology/scrum@1.0.0:
# - R-10: bug.sync_state at start and review (this repository's dl-025);
# - R-11: build split into design · red · green · refactor, one step each, the same agent in distinct
#   sessions (dl-028). WingFoil 0.3.2 validates distinct_from, checks and optional but runs none: the
#   script runner enforces distinct_from, runs the checks bound in .wingfoil/workflows/bindings.yaml
#   and, since runner 1.2.6, skips the optional red for a task whose pre check flow-tdd fails (a task
#   with `flow: direct`), WingFoil v1.0's semantics (spec-003 optional, P4.12).
name: backlog-item
kind: sub
element: task
description: "One Sprint Backlog item, to the Definition of Done"
version: 2
phases:
  - name: start
    description: "A Developer starts the item (backlog to in-progress)."
    role: developer
    actions:
      - element.set_state(in-progress)
      - 'bug.sync_state(for_each: task.bug)'
  - name: design
    description: >-
      The Developer, working as architect, reads first, checks the specs, classifies each acceptance
      criterion red-first or characterization, and commits the design; no code.
    role: developer
    actions:
      - agent.execute
    checks:
      post: [commit-trailers]
  - name: red
    description: >-
      Another session writes the failing tests of the red-first criteria, and nothing else, and
      commits them. Skipped for a task with `flow: direct` (no red-first criterion).
    role: qa
    mode: fresh
    optional: true
    actions:
      - agent.execute
    checks:
      pre: [flow-tdd]
      post: [tests-red, commit-trailers]
  - name: green
    description: "Another session makes red's tests pass with the least code; it does not touch red's tests."
    role: developer
    mode: fresh
    distinct_from: [red]
    actions:
      - agent.execute
    checks:
      post: [tests-green, red-tests-untouched, commit-trailers]
  - name: refactor
    description: "Clean the code with the tests green: the local gates, the docs, the characterization tests."
    role: developer
    actions:
      - agent.execute
    checks:
      post: [tests-green, red-tests-untouched, commit-trailers]
  - name: review
    description: "A reviewer checks the work against the Definition of Done (to in-review)."
    role: reviewer
    mode: fresh
    distinct_from: [red, green, refactor]
    actions:
      - memory.submit
      - 'bug.sync_state(for_each: task.bug)'
  - name: approve
    description: "The approver approves the item; a reject goes back to green."
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: green }
  - name: done
    description: "The item is done (approved to done)."
    role: developer
    actions:
      - memory.submit

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-index:5\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex:none\">\n      <img src=\"3aa4e32b-5c56-4982-bc35-5e6f71326d52\" alt=\"WingFoil\" title=\"WingFoil\" style=\"height:22px;width:auto\">\n    <\u002Fdiv>\n    <div style=\"position:relative;flex:none\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid #E3E8EF;border-radius:8px;background:#FFFFFF;color:#081532;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:#F5F7FA\">\n        <span>{{ proj.name }}<\u002Fspan>\n        <span style=\"font-size:11px;color:#6B7890;font-weight:400\">{{ proj.methodology }}<\u002Fspan>\n        <span style=\"font-size:10px;color:#6B7890\">▾<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ projMenu }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:38px;left:0;width:320px;background:#FFFFFF;border:1px solid #E3E8EF;border-radius:10px;box-shadow:0 12px 32px rgba(8,21,50,0.12);padding:6px;z-index:10\">\n          <sc-for list=\"{{ projects }}\" as=\"pj\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:2px;border-radius:7px;background:{{ pj.bg }}\">\n              <button sc-camel-on-click=\"{{ pj.pick }}\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:none;border-radius:7px;text-align:left;cursor:pointer;color:#081532;background:transparent\" style-hover=\"background:#F0F4F9\">\n                <span style=\"font-size:13px;font-weight:500\">{{ pj.name }}<\u002Fspan>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:#6B7890;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%\">{{ pj.sub }}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ pj.removable }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ pj.remove }}\" title=\"Rimuovi dalla UI\" style=\"flex:none;width:26px;height:26px;margin-right:4px;border:none;border-radius:6px;background:transparent;color:#8A96A8;font-size:15px;cursor:pointer\" style-hover=\"background:#FDECEC;color:#B42318\">×<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"height:1px;background:#EEF1F5;margin:6px 4px\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openAddProj }}\" style=\"width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:none;border-radius:7px;text-align:left;cursor:pointer;color:#0C469F;background:transparent;font-size:13px;font-weight:500\" style-hover=\"background:#F0F4F9\">+ Aggiungi progetto…<\u002Fbutton>\n          <div style=\"padding:4px 10px 6px;font-size:11px;color:#8A96A8\">I progetti aggiunti restano salvati in questa UI.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 auto;display:flex;align-items:center;min-width:60px;font-size:13px;color:#6B7890;overflow:hidden;direction:rtl\">\n      <span style=\"display:flex;align-items:center;gap:6px;direction:ltr;white-space:nowrap\">\n        <sc-for list=\"{{ crumbs }}\" as=\"cr\" hint-placeholder-count=\"3\">\n          <span style=\"color:#B3BCC9\">›<\u002Fspan>\n          <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:{{ cr.fg }}\">{{ cr.name }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openPalette }}\" title=\"Cerca o esegui un'azione\" style=\"flex:0 1 220px;min-width:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 6px 0 8px;border:1px solid #E3E8EF;border-radius:8px;background:#F5F7FA;color:#6B7890;font-size:13px;cursor:pointer;overflow:hidden\" style-hover=\"border-color:#C9D2DE\">\n      <span style=\"white-space:nowrap;overflow:hidden;text-over ">Modifica<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ dirEditing }}\" hint-placeholder-val=\"{{ false }}\">\n            <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;overflow:hidden\">\n              <sc-for list=\"{{ dirEdit }}\" as=\"de\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid #EEF1F5\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <span style=\"flex:0 0 160px;font-family:'Geist Mono',monospace;font-size:13px;color:#081532\">{{ de.name }}<\u002Fspan>\n                    <input value=\"{{ de.desc }}\" sc-camel-on-change=\"{{ de.onDesc }}\" placeholder=\"Descrizione\" style=\"flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid #D6DDE7;border-radius:6px;font-size:13px;color:#081532;outline:none\">\n                    <button sc-camel-on-click=\"{{ de.del }}\" title=\"Rimuovi\" style=\"width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#B42318;font-size:16px;cursor:pointer\" style-hover=\"background:#FDECEC\">×<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:4px;padding-left:170px\">\n                    <sc-for list=\"{{ de.roles }}\" as=\"dr\" hint-placeholder-count=\"6\">\n                      <button sc-camel-on-click=\"{{ dr.toggle }}\" style=\"height:24px;padding:0 8px;border-radius:5px;font-family:'Geist Mono',monospace;font-size:11px;cursor:pointer;border:1px solid {{ dr.border }};background:{{ dr.bg }};color:{{ dr.fg }}\">{{ dr.name }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;gap:8px;align-items:center;padding:12px 16px;background:#FBFCFD\">\n file Markdown si aprono qui, i collegamenti esterni in una nuova scheda.<\u002Fp>\n            <\u002Fdiv>\n            <sc-for list=\"{{ docIndex }}\" as=\"dg\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <div style=\"display:flex;align-items:baseline;gap:12px;padding:0 0 8px;border-bottom:1px solid #D6DDE7\">\n                  <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#8A96A8;width:32px\">{{ dg.num }}<\u002Fspan>\n                  <span style=\"font-size:16px;font-weight:600;letter-spacing:-0.2px\">{{ dg.group }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ dg.items }}\" as=\"dc\" hint-placeholder-count=\"3\">\n                  <sc-if value=\"{{ dc.isMd }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button sc-camel-on-click=\"{{ dc.open }}\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 0;border:none;border-bottom:1px solid #EEF1F5;background:transparent;text-align:left;cursor:pointer;color:#081532;width:100%\" style-hover=\"background:#F8FAFC\">\n                      <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#8A96A8;width:32px;flex:none\">{{ dc.num }}<\u002Fspan>\n                      <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                        <span style=\"font-size:14px;font-weight:500;color:#0C469F\">{{ dc.title }}<\u002Fspan>\n                        <span style=\"font-size:12px;color:#6B7890\">{{ dc.desc }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:11px;color:#8A96A8\">{{ dc.path }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ dc.isExt }}\" hint-placeholder-val=\"{{ false }}\">\n                    <a href=\"{{ dc.url }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid #EEF1F5;text-decoration:none;color:#081532\" style-hover=\"background:#F8FAFC\">\n                      <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#8A96A8;width:32px;flex:none\">{{ dc.num }}<\u002Fspan>\n                      <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                        <span style=\"font-size:14px;font-weight:500;color:#0C469F\">{{ dc.title }} ↗<\u002Fspan>\n                        <span style=\"font-size:12px;color:#6B7890\">{{ dc.desc }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"flex:none;font-size:11px;color:#8A96A8\">nuova scheda<\u002Fspan>\n                    <\u002Fa>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ docReading }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:820px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ docBack }}\" style=\"height:30px;padding:0 10px;border:1px solid #E3E8EF;border-radius:7px;background:#FFFFFF;color:#081532;font-size:13px;cursor:pointer\" style-hover=\"background:#F5F7FA\">← Indice<\u002Fbutton>\n              <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#6B7890;flex:1;min-width:0\">{{ docCur.path }}<\u002Fspan>\n              <sc-if value=\"{{ docGh }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ docGh }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px\">Apri su GitHub ↗<\u002Fa>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <article ref=\"{{ docRef }}\" style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:28px 36px 36px;font-size:14px;color:#3B4A63;overflow-wrap:anywhere\"><\u002Farticle>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1000px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-0.4px\">Team<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#6B7890\">Membri e agenti registrati in dna.team. Le approvazioni seguono i ruoli, mai le persone.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <input value=\"{{ teamQ }}\" sc-camel-on-change=\"{{ onTeamQ }}\" placeholder=\"Cerca per nome o email\" style=\"height:32px;width:240px;max-width:100%;padding:0 12px;border:1px solid #E3E8EF;border-radius:8px;background:#FFFFFF;font-size:13px;color:#081532;outline:none\">\n              <button sc-camel-on-click=\"{{ teamGatesChip.pick }}\" style=\"height:30px;padding:0 12px;border-radius:999px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid {{ teamGatesChip.border }};background:{{ teamGatesChip.bg }};color:{{ teamGatesChip.fg }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:#F0B44C\"><\u002Fspan>{{ teamGatesChip.label }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <sc-for list=\"{{ teamRoleChips }}\" as=\"rc\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ rc.pick }}\" style=\"height:28px;padding:0 10px;border-radius:999px;font-family:'Geist Mono',monospace;font-size:11px;cursor:pointer;border:1px solid {{ rc.border }};background:{{ rc.bg }};color:{{ rc.fg }}\">{{ rc.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ teamEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:28px;text-align:center;font-size:14px;color:#6B7890;background:#FFFFFF;border:1px dashed #D6DDE7;border-radius:12px\">Nessun membro corrisponde ai filtri.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px\">\n            <sc-for list=\"{{ team }}\" as=\"tm\" hint-placeholder-count=\"4\">\n              <div style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <span style=\"width:38px;height:38px;border-radius:50%;flex:none;background:{{ tm.avBg }};color:#FFFFFF;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ tm.initials }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                    <span style=\"display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500\">{{ tm.name }}\n                      <sc-if value=\"{{ tm.isMe }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:#E3F0FB;color:#0C469F\">tu<\u002Fspan><\u002Fsc-if>\n                    <\u002Fspan>\n                    <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#8A96A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ tm.email }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:4px\">\n                  <sc-for list=\"{{ tm.roles }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <span style=\"font-family:'Geist Mono',monospace;font-size:11px;padding:2px 6px;border-radius:4px;background:#EEF1F5;color:#3B4A63\">{{ r }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <span style=\"font-size:12px;color:#6B7890;padding-top:10px;border-top:1px solid #EEF1F5\">{{ tm.gates }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isConfig }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1100px;display:flex;flex-direction:column;gap:18px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-0.4px\">Configurazione<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#6B7890\">Quello che governa il progetto e quello che dice alla UI come rappresentarlo.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:2px;border-bottom:1px solid #E3E8EF;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden\">\n            <sc-for list=\"{{ cfgTabs }}\" as=\"ct\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ ct.pick }}\" style=\"flex:none;white-space:nowrap;height:36px;padding:0 10px;border:none;background:transparent;font-size:13px;cursor:pointer;margin-bottom:-1px;border-bottom:2px solid {{ ct.line }};color:{{ ct.fg }};font-weight:{{ ct.fw }};display:flex;align-items:center;gap:6px\">{{ ct.label }}<span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:#8A96A8\">{{ ct.src }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ cfgLockNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:10px 14px;border-radius:10px;background:#F5F7FA;border:1px solid #E3E8EF;font-size:13px;color:#3B4A63\">{{ cfgLockNote }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ cfgIsGeneral }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"font-size:12px;color:#8A96A8\">Proposta per WingFoil core. DNA, memoria, workflow e direttive si modificano nelle rispettive pagine.<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px\">\n              <sc-for list=\"{{ cfgSettings }}\" as=\"cs\" hint-placeholder-count=\"4\">\n                <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;overflow:hidden\">\n                  <div style=\"padding:12px 16px 8px;font-size:14px;font-weight:600\">{{ cs.group }}<\u002Fdiv>\n                  <sc-for list=\"{{ cs.items }}\" as=\"si\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;align-items:center;gap:16px;padding:10px 16px;border-top:1px solid #EEF1F5\">\n                      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                        <span style=\"font-size:13px;color:#081532\">{{ si.label }}<\u002Fspan>\n                        <span style=\"font-size:12px;color:#8A96A8;text-wrap:pretty\">{{ si.hint }}<\u002Fspan>\n                        <span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:#B3BCC9\">{{ si.key }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ si.isBool }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button sc-camel-on-click=\"{{ si.toggle }}\" style=\"flex:none;position:relative;width:36px;height:22px;border:none;border-radius:11px;cursor:pointer;padding:0;background:{{ si.trackBg }};opacity:{{ cfgOp }}\">\n                          <span style=\"position:absolute;top:2px;left:{{ si.knobX }};width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(8,21,50,0.25)\"><\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ si.isEnum }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"flex:none;display:flex;padding:3px;gap:2px;background:#EEF1F5;border-radius:8px;opacity:{{ cfgOp }}\">\n                          <sc-for list=\"{{ si.opts }}\" as=\"so\" hint-placeholder-count=\"2\">\n                            <button sc-camel-on-click=\"{{ so.pick }}\" style=\"height:26px;padding:0 9px;border:none;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;background:{{ so.bg }};color:{{ so.fg }};font-weight:{{ so.fw }};box-shadow:{{ so.shadow }}\">{{ so.label }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsection>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ cfgIsPerms }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:12px;color:#8A96A8;text-wrap:pretty\">Chi può eseguire le azioni che cambiano il progetto. Le approvazioni dei gate non sono qui: seguono i ruoli dichiarati in memory.yaml. Un'azione è permessa se la persona ha uno dei ruoli scelti oppure è elencata per nome.<\u002Fspan>\n            <sc-for list=\"{{ permGroups }}\" as=\"pg\" hint-placeholder-count=\"4\">\n              <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;overflow:hidden\">\n                <div style=\"padding:12px 16px 8px;font-size:14px;font-weight:600\">{{ pg.group }}<\u002Fdiv>\n                <sc-for list=\"{{ pg.rows }}\" as=\"pr\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:8px 16px;padding:10px 16px;border-top:1px solid #EEF1F5;align-items:start\">\n                    <div style=\"display:flex;flex-direction:column;gap:2px\">\n                      <span style=\"font-size:13px;color:#081532\">{{ pr.label }}<\u002Fspan>\n                      <span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:#B3BCC9\">{{ pr.key }}<\u002Fspan>\n                      <span style=\"font-size:11px;color:{{ pr.youFg }}\">{{ pr.you }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <div style=\"display:flex;flex-wrap:wrap;gap:4px;align-items:center\">\n                        <span style=\"font-size:11px;color:#8A96A8;width:44px\">ruoli<\u002Fspan>\n                        <sc-for list=\"{{ pr.roles }}\" as=\"rr\" hint-placeholder-count=\"4\">\n                          <button sc-camel-on-click=\"{{ rr.toggle }}\" style=\"height:24px;padding:0 8px;border-radius:5px;font-family:'Geist Mono',monospace;font-size:11px;cursor:pointer;border:1px solid {{ rr.border }};background:{{ rr.bg }};color:{{ rr.fg }}\">{{ rr.name }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ pr.hasPeople }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;flex-wrap:wrap;gap:4px;align-items:center\">\n                          <span style=\"font-size:11px;color:#8A96A8;width:44px\">persone<\u002Fspan>\n                          <sc-for list=\"{{ pr.people }}\" as=\"pp\" hint-placeholder-count=\"2\">\n                            <button sc-camel-on-click=\"{{ pp.toggle }}\" style=\"height:24px;padding:0 8px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid {{ pp.border }};background:{{ pp.bg }};color:{{ pp.fg }}\">{{ pp.name }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ cfgIsTax }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:12px 14px;border-radius:10px;background:#F8FAFC;border:1px solid #E3E8EF;display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-size:13px;line-height:1.55;color:#3B4A63;text-wrap:pretty\">Ogni progetto chiama i suoi elementi come vuole (task, story, rfc…). La tassonomia li associa a poche <strong style=\"font-weight:600;color:#081532\">categorie fisse della UI<\u002Fstrong>, così la UI sa dove mostrarli e come calcolare tracciabilità, copertura e completamento. Si configura in <span style=\"font-family:'Geist Mono',monospace;font-size:12px\">.wingfoil/ui.yaml › taxonomy<\u002Fspan>.<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px\">\n                <sc-for list=\"{{ cfgCats }}\" as=\"cc\" hint-placeholder-count=\"8\">\n                  <div style=\"display:flex;gap:8px;align-items:baseline\">\n                    <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:11px;padding:1px 6px;border-radius:4px;background:#FFFFFF;border:1px solid #E3E8EF;color:#0C469F\">{{ cc.key }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#3B4A63;text-wrap:pretty\">{{ cc.desc }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px\">\n              <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n                <span style=\"font-size:14px;font-weight:600\">Tipi → categorie UI<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.5;color:#6B7890;text-wrap:pretty\"><b style=\"font-weight:600\">categoria<\u002Fb>: una delle categorie qui sopra; un tipo non mappato non entra in tracciabilità né nel completamento. <b style=\"font-weight:600\">deve citare<\u002Fb>: categorie che ogni elemento del tipo deve avere tra i riferimenti; se mancano, la UI lo segnala e, con <span style=\"font-family:'Geist Mono',monospace\">workflow.checks = blocca<\u002Fspan>, ne impedisce l’invio.<\u002Fspan>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#8A96A8\">categories: { task: work } · requires: { task: [requirement] }<\u002Fspan>\n                <div style=\"display:flex;gap:10px;font-size:11px;color:#8A96A8\"><span style=\"flex:0 0 110px\">tipo<\u002Fspan><span style=\"flex:1\">categoria<\u002Fspan><span style=\"flex:1\">deve citare<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ cfgTaxonomy }}\" as=\"ctx\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;gap:10px;align-items:baseline;font-size:13px\">\n                    <span style=\"flex:0 0 110px;font-family:'Geist Mono',monospace;font-size:12px;color:#0C469F\">{{ ctx.type }}<\u002Fspan>\n                    <span style=\"flex:1;color:#081532\">{{ ctx.cat }}<\u002Fspan>\n                    <span style=\"flex:1;color:#6B7890\">{{ ctx.requires }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n              <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:14px;font-weight:600\">Riconoscimento riferimenti<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.5;color:#6B7890;text-wrap:pretty\">Per i riferimenti che non sono id di elementi di memoria (requisiti, user story, feature definiti nei documenti). Ogni regola è un’<b style=\"font-weight:600\">espressione regolare<\u002Fb> confrontata con il testo del riferimento: la prima che corrisponde decide la categoria. Gli id di memoria si riconoscono da soli tramite il loro tipo.<\u002Fspan>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#8A96A8\">^REQ- → requirement  ·  ^US-\\d → requirement  ·  ^P\\d → feature<\u002Fspan>\n                <sc-for list=\"{{ cfgPatterns }}\" as=\"cp\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:10px;align-items:baseline\">\n                    <span style=\"flex:1;min-width:0;font-family:'Geist Mono',monospace;font-size:12px;color:#081532\">{{ cp.re }}<\u002Fspan>\n                    <span style=\"flex:none;font-size:12px;color:#6B7890\">→ {{ cp.cat }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ cfgIsProg }}\" hint-placeholder-val=\"{{ false }}\">\n            <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;max-width:640px\">\n              <span style=\"font-size:14px;font-weight:600\">Card di avanzamento<\u002Fspan>\n              <span style=\"font-size:12px;line-height:1.5;color:#6B7890;text-wrap:pretty\">Definisce la card in cima a Oggi: quale parte del workflow mostrare, quali elementi contare e come. Si configura in <span style=\"font-family:'Geist Mono',monospace\">ui.yaml › progress<\u002Fspan>.<\u002Fspan>\n              <sc-for list=\"{{ cfgProgress }}\" as=\"cg\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:10px;align-items:baseline;padding-top:8px;border-top:1px solid #EEF1F5\">\n                  <span style=\"flex:0 0 130px;font-size:12px;color:#6B7890\">{{ cg.k }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\">\n                    <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#081532\">{{ cg.v }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;line-height:1.45;color:#8A96A8;text-wrap:pretty\">{{ cg.hint }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ cfgIsId }}\" hint-placeholder-val=\"{{ false }}\">\n            <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;max-width:640px\">\n              <span style=\"font-size:14px;font-weight:600\">Identità<\u002Fspan>\n              <span style=\"font-size:12px;line-height:1.5;color:#6B7890;text-wrap:pretty\">Come la UI riconosce chi la sta usando. Non c’è login: vale la stessa identità usata da git e dalla CLI, quindi i commit e le approvazioni fatti dalla UI sono firmati come quelli da terminale.<\u002Fspan>\n              <sc-for list=\"{{ cfgIdentity }}\" as=\"ci\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:10px;align-items:baseline;padding-top:8px;border-top:1px solid #EEF1F5\">\n                  <span style=\"flex:0 0 130px;font-size:12px;color:#6B7890\">{{ ci.k }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\">\n                    <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#081532\">{{ ci.v }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;line-height:1.45;color:#8A96A8;text-wrap:pretty\">{{ ci.hint }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTimeline }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1100px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-0.4px\">Timeline<\u002Fh1>\n              <p style=\"margin:0;font-size:14px;color:#6B7890\">La storia del repository e degli elementi di memoria, letta da git.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;padding:3px;gap:2px;background:#EEF1F5;border-radius:8px\">\n              <sc-for list=\"{{ tlTabs }}\" as=\"tt\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ tt.pick }}\" style=\"height:30px;padding:0 12px;border:none;border-radius:6px;font-size:13px;cursor:pointer;background:{{ tt.bg }};color:{{ tt.fg }};font-weight:{{ tt.fw }};box-shadow:{{ tt.shadow }}\">{{ tt.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ tlIsGit }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n                <input value=\"{{ tlQ }}\" sc-camel-on-change=\"{{ onTlQ }}\" placeholder=\"Cerca nei messaggi dei commit\" style=\"height:32px;width:260px;max-width:100%;padding:0 12px;border:1px solid #E3E8EF;border-radius:8px;background:#FFFFFF;font-size:13px;color:#081532;outline:none\">\n                <button sc-camel-on-click=\"{{ tlMemChip.pick }}\" style=\"height:30px;padding:0 12px;border-radius:999px;font-size:13px;cursor:pointer;border:1px solid {{ tlMemChip.border }};background:{{ tlMemChip.bg }};color:{{ tlMemChip.fg }}\">Solo modifiche alla memoria<\u002Fbutton>\n                <span style=\"font-size:12px;color:#8A96A8\">{{ tlCount }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap;align-items:center\"><span style=\"font-size:11px;color:#8A96A8;width:52px\">branch<\u002Fspan><sc-for list=\"{{ tlBranches }}\" as=\"tb\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"height:28px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid {{ tb.border }};background:{{ tb.bg }};color:{{ tb.fg }}\"><span style=\"width:7px;height:7px;border-radius:2px;background:{{ tb.dot }}\"><\u002Fspan>{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap;align-items:center\"><span style=\"font-size:11px;color:#8A96A8;width:52px\">autore<\u002Fspan><sc-for list=\"{{ tlAuthors }}\" as=\"ta\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ ta.pick }}\" style=\"height:28px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid {{ ta.border }};background:{{ ta.bg }};color:{{ ta.fg }}\"><span style=\"width:7px;height:7px;border-radius:2px;background:{{ ta.dot }}\"><\u002Fspan>{{ ta.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n            <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;overflow:hidden\">\n              <sc-for list=\"{{ tlRows }}\" as=\"c\" hint-placeholder-count=\"10\">\n                <div sc-camel-on-click=\"{{ c.toggle }}\" style=\"display:flex;align-items:stretch;min-height:42px;border-bottom:1px solid #EEF1F5;cursor:pointer;background:{{ c.bg }}\" style-hover=\"background:#F8FAFC\">\n                  <div style=\"display:flex;flex:none;padding-left:10px\">\n                    <sc-for list=\"{{ c.cells }}\" as=\"cl\" hint-placeholder-count=\"2\">\n                      <span style=\"position:relative;width:18px;flex:none;display:block\">\n                        <sc-if value=\"{{ cl.line }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"position:absolute;left:8px;top:0;bottom:0;width:2px;background:{{ cl.color }}\"><\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ cl.dot }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;left:3px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:{{ cl.fill }};border:2px solid {{ cl.color }}\"><\u002Fspan><\u002Fsc-if>\n                      <\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px\">\n                    <sc-for list=\"{{ c.tips }}\" as=\"tp\" hint-placeholder-count=\"1\">\n                      <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid {{ tp.color }};color:{{ tp.color }}\">{{ tp.name }}<\u002Fspan>\n                    <\u002Fsc-for>\n                    <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:11px;padding:2px 6px;border-radius:4px;background:{{ c.tagBg }};color:{{ c.tagFg }}\">{{ c.tag }}<\u002Fspan>\n                    <span style=\"flex:1;min-width:0;font-size:13px;color:#081532;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.rest }}<\u002Fspan>\n                    <span style=\"flex:none;font-size:12px;color:#6B7890;white-space:nowrap\">{{ c.author }}<\u002Fspan>\n                    <span style=\"flex:none;font-size:12px;color:#8A96A8;white-space:nowrap;width:92px;text-align:right\">{{ c.when }}<\u002Fspan>\n                    <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:11px;color:#8A96A8\">{{ c.sha }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ c.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:10px 16px 14px 64px;background:#F8FAFC;border-bottom:1px solid #EEF1F5;display:flex;flex-direction:column;gap:8px\">\n                    <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#081532;word-break:break-word\">{{ c.msg }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#6B7890\">{{ c.author }} · {{ c.date }} · branch {{ c.branch }}<\u002Fspan>\n                    <div style=\"display:flex;flex-direction:column;gap:2px\">\n                      <sc-for list=\"{{ c.files }}\" as=\"cf\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{ cf.open }}\" style=\"align-self:flex-start;border:none;background:none;padding:0;cursor:pointer;font-family:'Geist Mono',monospace;font-size:11px;color:#1686C8\">{{ cf.path }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ c.memLink }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ c.openMem }}\" style=\"align-self:flex-start;height:28px;padding:0 10px;border:1px solid #E3E8EF;border-radius:7px;background:#FFFFFF;color:#0C469F;font-size:12px;cursor:pointer\">Apri {{ c.memLink }}<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ tlEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:24px;text-align:center;font-size:13px;color:#6B7890\">Nessun commit corrisponde ai filtri.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tlIsAxis }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap;align-items:center\">\n                <span style=\"font-size:11px;color:#8A96A8;width:52px\">eventi<\u002Fspan>\n                <sc-for list=\"{{ axKinds }}\" as=\"ak\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ ak.pick }}\" style=\"height:28px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid {{ ak.border }};background:{{ ak.bg }};color:{{ ak.fg }}\">{{ ak.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap;align-items:center\"><span style=\"font-size:11px;color:#8A96A8;width:52px\">tipo<\u002Fspan><sc-for list=\"{{ axTypes }}\" as=\"ay\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ ay.pick }}\" style=\"height:28px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid {{ ay.border }};background:{{ ay.bg }};color:{{ ay.fg }}\"><span style=\"width:7px;height:7px;border-radius:2px;background:{{ ay.dot }}\"><\u002Fspan>{{ ay.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap;align-items:center\"><span style=\"font-size:11px;color:#8A96A8;width:52px\">autore<\u002Fspan><sc-for list=\"{{ axAuthors }}\" as=\"au\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ au.pick }}\" style=\"height:28px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid {{ au.border }};background:{{ au.bg }};color:{{ au.fg }}\"><span style=\"width:7px;height:7px;border-radius:2px;background:{{ au.dot }}\"><\u002Fspan>{{ au.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n            <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:18px 20px 14px;display:flex;flex-direction:column;gap:0\">\n              <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6B7890;padding-bottom:6px\"><span>▲ creati<\u002Fspan><span>{{ axTotals }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:3px;height:96px;padding-right:12px\">\n                <sc-for list=\"{{ axDays }}\" as=\"ad\" hint-placeholder-count=\"20\">\n                  <button sc-camel-on-click=\"{{ ad.pick }}\" title=\"{{ ad.title }}\" style=\"flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;border:none;padding:0 1px;cursor:pointer;border-radius:4px 4px 0 0;background:{{ ad.bg }}\">\n                    <sc-for list=\"{{ ad.created }}\" as=\"sg\" hint-placeholder-count=\"1\"><span style=\"display:block;width:100%;max-width:16px;height:{{ sg.h }};background:{{ sg.c }};border-radius:2px\"><\u002Fspan><\u002Fsc-for>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"position:relative;height:2px;background:#081532;margin-right:12px\"><span style=\"position:absolute;right:-12px;top:-6px;width:0;height:0;border-left:12px solid #081532;border-top:7px solid transparent;border-bottom:7px solid transparent\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:3px;height:96px;padding-right:12px\">\n                <sc-for list=\"{{ axDays }}\" as=\"ad2\" hint-placeholder-count=\"20\">\n                  <button sc-camel-on-click=\"{{ ad2.pick }}\" title=\"{{ ad2.title }}\" style=\"flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;padding:0 1px;cursor:pointer;border-radius:0 0 4px 4px;background:{{ ad2.bg }}\">\n                    <sc-for list=\"{{ ad2.changes }}\" as=\"sg2\" hint-placeholder-count=\"1\"><span style=\"display:block;width:100%;max-width:16px;height:{{ sg2.h }};background:{{ sg2.c }};border-radius:2px;opacity:0.75\"><\u002Fspan><\u002Fsc-for>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:3px;padding-right:12px\">\n                <sc-for list=\"{{ axDays }}\" as=\"ad3\" hint-placeholder-count=\"20\">\n                  <span style=\"flex:1 1 0;min-width:0;text-align:center;font-family:'Geist Mono',monospace;font-size:10px;color:{{ ad3.labelFg }};white-space:nowrap;overflow:visible\">{{ ad3.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6B7890;padding-top:6px\"><span>▼ cambi di stato<\u002Fspan><span>tempo →<\u002Fspan><\u002Fdiv>\n            <\u002Fsection>\n            <sc-if value=\"{{ axSel }}\" hint-placeholder-val=\"{{ false }}\">\n              <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;overflow:hidden\">\n                <div style=\"padding:12px 16px;font-size:14px;font-weight:600;display:flex;justify-content:space-between\"><span>{{ axSelLabel }}<\u002Fspan><span style=\"font-size:12px;font-weight:400;color:#6B7890\">{{ axSelCount }}<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ axEvents }}\" as=\"ev\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ ev.open }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:9px 16px;border:none;border-top:1px solid #EEF1F5;background:#FFFFFF;text-align:left;cursor:pointer;color:#081532\" style-hover=\"background:#F8FAFC\">\n                    <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:11px;color:#8A96A8;width:40px\">{{ ev.time }}<\u002Fspan>\n                    <span style=\"flex:none;width:8px;height:8px;border-radius:2px;background:{{ ev.color }}\"><\u002Fspan>\n                    <span style=\"flex:none;font-family:'Geist Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;background:#EEF1F5;color:#3B4A63\">{{ ev.tag }}<\u002Fspan>\n                    <span style=\"flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ ev.id }}<\u002Fspan>\n                    <span style=\"flex:none;font-size:12px;color:#3B4A63\">{{ ev.what }}<\u002Fspan>\n                    <span style=\"flex:none;font-size:12px;color:#8A96A8\">{{ ev.author }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFiles }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-0.4px\">File<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#6B7890\">La struttura del repository, in sola lettura. Modifica, creazione ed eliminazione con commit arriveranno qui.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr);gap:16px;align-items:start\">\n            <section style=\"background:#FFFFFF;border:1px solid #E3E8EF;border-radius:12px;padding:6px;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:0\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px\">\n                <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#3B4A63\">{{ fbRoot }}<\u002Fspan>\n                <button disabled=\"disabled\" title=\"In arrivo: nuovo file con commit\" style=\"height:24px;padding:0 8px;border:1px dashed #D6DDE7;border-radius:6px;background:#FFFFFF;color:#B3BCC9;font-size:11px;cursor:not-allowed\">+ Nuovo<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ fbRows }}\" as=\"fr\" hint-placeholder-count=\"12\">\n                <button sc-camel-on-click=\"{{ fr.click }}\" style=\"width:100%;display:flex;align-items:center;gap:6px;height:26px;padding-right:8px;border:none;border-radius:5px;text-align:left;cursor:pointer;font-size:12.5px;padding-left:{{ fr.indent }};background:{{ fr.bg }};color:{{ fr.fg }}\ ogress definition, personas, directives, DNA. The UI only reads this shape.\nconst h = (who, when, text, commit, reason) => ({ who, when, text, commit, reason });\nconst NEUTRAL_END = ['superseded', 'closed', 'withdrawn', 'deprecated'];\n\nconst SETTINGS = [\n  { group: 'Git', items: [\n    { key: 'git.autoPush', label: 'Push automatico dopo ogni commit', hint: 'Ogni commit wf(…) viene inviato subito al remote', kind: 'bool' },\n    { key: 'git.runBranch', label: 'Branch dei run', hint: 'Dove lavorano gli agenti durante un passo', kind: 'enum', options: ['corrente', 'uno per task'] },\n    { key: 'git.signCommits', label: 'Commit firmati', hint: 'Richiede la firma GPG/SSH sui commit di stato', kind: 'bool' },\n  ] },\n  { group: 'Approvazioni', items: [\n    { key: 'approve.reasonRequired', label: 'Motivazione obbligatoria anche per approvare', hint: 'Se spento, la UI propone un testo predefinito', kind: 'bool' },\n    { key: 'approve.noSelf', label: 'Vieta l’auto-approvazione', hint: 'Chi ha fatto submit non può approvare lo stesso elemento', kind: 'bool' },\n  ] },\n  { group: 'Workflow', items: [\n    { key: 'wf.checks', label: 'Controlli post-step', hint: 'Cosa succede se un check di frontmatter fallisce', kind: 'enum', options: ['blocca', 'avvisa'] },\n  ] },\n  { group: 'Agenti', items: [\n    { key: 'agent.default', label: 'Agente predefinito', hint: 'Usato da agent execute', kind: 'enum', options: ['Claude Code', 'Cursor', 'Codex'] },\n    { key: 'agent.launch', label: 'Avvio', hint: 'Prima di lanciare un agente su un passo', kind: 'enum', options: ['chiedi conferma', 'automatico'] },\n  ] },\n  { group: 'Notifiche', items: [\n    { key: 'notify.channel', label: 'Canale', hint: 'Dove arrivano le richieste di approvazione', kind: 'enum', options: ['solo UI/CLI', 'email', 'Slack'] },\n  ] },\n];\nconst CAT_LABEL = { work: 'lavoro', defect: 'difetto', decision: 'decisione', spec: 'specifica', requirement: 'requisito', feature: 'feature', release: 'release', external: 'esterno' };\nconst WF = {\n  name: 'WingFoil', methodology: 'custom', git: 'main @ 9f95f47', sub: 'custom · sw-life-cycle · dogfooding',\n  me: { name: 'Roberto Pompermaier', email: 'robypomper@gmail.com' },\n  settings: { 'git.autoPush': false, 'git.runBranch': 'corrente', 'git.signCommits': false, 'approve.reasonRequired': true, 'approve.noSelf': false, 'wf.checks': 'blocca', 'agent.default': 'Claude Code', 'agent.launch': 'chiedi conferma', 'notify.channel': 'solo UI/CLI' },\n  refDocs: {\n    'P4.1': ['Workflow DSL e include()', 'Definizione dei workflow in YAML, composizione main/sub.', 'docs/01_vision/06_features.md'],\n    'P4.2': ['workflow start', 'Avvia un main workflow; più main possono essere aperti insieme.', 'docs/01_vision/06_features.md'],\n    'P4.3': ['workflow show', 'Mostra struttura, fasi e sub composti di un workflow.', 'docs/01_vision/06_features.md'],\n    'P4.4': ['workflow next', 'Indica il prossimo passo eseguibile con ruolo, direttive e contesto.', 'docs/01_vision/06_features.md'],\n    'P4.5': ['workflow status', 'Stato dei main aperti e dei gate in attesa, per ruolo.', 'docs/01_vision/06_features.md'],\n    'P4.6': ['agent execute', 'Lancia l’agente configurato con il contesto del passo caricato.', 'docs/01_vision/06_features.md'],\n    'P4.7': ['workflow end', 'Chiude un run e ne registra l’esito.', 'docs/01_vision/06_features.md'],\n    'P4.9': ['Routing approvazioni per ruolo', 'I gate notificano i membri che hanno il ruolo richiesto.', 'docs/01_vision/06_features.md'],\n    'P6.1': ['Notifiche', 'Avviso quando serve un intervento umano.', 'docs/01_vision/06_features.md'],\n    'P1.9': ['memory search', 'Ricerca per parola chiave negli elementi di memoria.', 'docs/01_vision/06_features.md'],\n    'P3.8': ['Direttive built-in', 'Sei template installati da init.', 'docs/01_vision/06_features.md'],\n    'REQ-PERF-03': ['Latenza del prossimo passo', 'workflow next risponde in meno di 1.000 ms.', 'docs/02_requirements/03_sard/'],\

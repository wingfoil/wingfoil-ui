<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/wingfoil-mark.svg" />
    <!-- Written from the catalogue's title.app by the build (vite.config.ts, W5-2). -->
    <title>title.app</title>
    <script id="wfui-theme">
      // spec-009 §1: the theme follows prefers-color-scheme, set before the first paint and on
      // every change of the system preference (X-08.1, X-08.2).
      (function () {
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          document.documentElement.setAttribute('data-theme', query.matches ? 'dark' : 'light');
        }
        apply();
        query.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
